# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (no warnings allowed)
        run: dotnet build Keystone.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test Keystone.slnx -c Release --no-build
