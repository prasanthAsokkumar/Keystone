# Pushing a tag like v1.2.0 builds Keystone for Apple-silicon and Intel Macs and publishes both disk images
# as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test Keystone.slnx -c Release
      - name: Build the disk images
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package-mac.sh --dmg --arch arm64
          ./scripts/package-mac.sh --dmg --arch x64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          shasum -a 256 Keystone-*.dmg > SHA256SUMS.txt
          # A release made by hand for this tag gets the files replaced; otherwise a new one is made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Keystone-*.dmg SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" Keystone-*.dmg SHA256SUMS.txt \
              --title "Keystone ${GITHUB_REF_NAME#v}" --generate-notes
          fi
