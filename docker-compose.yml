# Local AI for Keystone's document import: an Ollama server on http://localhost:11434.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5vl:7b
# Docker on macOS can't use the GPU, so the model runs on the CPU (slower than the Ollama app).
services:
  ollama:
    image: ollama/ollama:0.12.6
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # Only this Mac can reach it.
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
